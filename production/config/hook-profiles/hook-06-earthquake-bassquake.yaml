  - hook-06-club-crowd-spotlights
description: >
  Live booth: focused DJ at Pioneer decks with a crowd and white spotlights
  behind him. The earthquake is in the foreground — a row of water glasses
  on the booth edge vibrates so hard the liquid ripples and splashes as the
  lights slam on and the camera pushes into the decks. Bassquake, not a
  metaphor: you can see the water move. Fiction signal: stylised AI scene.
fiction_signal: visibly_stylised_or_impossible_scene
overlay_hook_ids: []
overlay_texts:
  - "this bass just caused an earthquake"
  - "watch the glasses — the room is shaking"
  - "bassquake. stay for the switch"
ctas:
