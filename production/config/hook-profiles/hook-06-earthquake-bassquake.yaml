    template: "bass so hard the glasses start an earthquake 🫨 {pairing}"
    status: testing
  - id: hook-06-cap-b
    template: "spotlights slam on and the booth shakes — {pairing}"
    status: testing
  - id: hook-06-cap-c
    template: "made in Spotify. the water disagrees 💧 {pairing}"
    status: testing
notes: >
  Re-analysed 2026-08-18: earlier "club spotlights" label missed the
