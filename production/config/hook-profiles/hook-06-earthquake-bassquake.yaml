    text: "rate the shake out of 10"
    intent: comment_rate
    slots: [post_payoff, closing]
  - id: hook-06-cta-b
    text: "send this to whoever needs their speaker to move"
    intent: share
    slots: [post_payoff, closing]
  - id: hook-06-cta-c
    text: "save this for when the room needs a bassquake"
    intent: save
    slots: [post_payoff, closing]
captions:
