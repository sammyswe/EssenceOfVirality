risks_and_uncertainty: >-
  Quantitative anchors (75% FYP share, 42s length peak) are secondary citations of
  an undescribed industry study — recorded at low confidence and easily over-read.
  The UW numbers come via a press interview cross-checked against one of its two
  primary papers; the WWW '24 personalisation paper was not separately ingested.
  All platform findings are 2021-2024 and platform-dependent; a 2025 reproduction
  study warns TikTok audit findings age quickly. The new skill rests on
  hypothesis-tier evidence and is deliberately quarantined in experimental/.

