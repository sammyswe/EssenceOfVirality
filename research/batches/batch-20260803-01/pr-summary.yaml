findings_summary: >-
  Five creator-supplied sources ingested. Strongest additions: Klug 2021
  (peer-reviewed; engagement correlates with plays, posting time matters, hashtag
  piling does not) and the UW 2024 data-donation studies (30-50% of early feed is
  interest-matched; most viewers complete only 30-50% of videos, stable over time;
  scroll-past speed is a weak personalisation signal; followed accounts get shown
  more but completed less and liked more). Herman 2023 grounds the packaging layer
  (on-screen text/search categorisation, trending-sound flywheel, loop-registered
  plays) and, with Klug, a high-confidence meta-finding that creator lore is often
  wrong. Lynch 2025 contributes secondhand leaked-document metrics (retention +
  watch time as core platform objectives). Zhou 2024 was assessed low-credibility
  and survives only as disputed low-confidence claims. Net: 17 claims, 17
  assessments, 2 niche hypotheses, 3 contradictions, 3 techniques, 1 new canonical
  knowledge doc, working model advanced to v0.1, and the first candidate skill in
  experimental/ (searchable-onscreen-text).

