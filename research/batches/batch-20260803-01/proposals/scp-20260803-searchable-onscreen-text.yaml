change_type: create
summary: >-
  New candidate skill: choose one honest on-screen text cue whose wording doubles as
  a listener search phrase, with placement and hashtag-restraint rules and a per-post
  indexing verification step.
justification: >-
  Belongs in a skill (not only knowledge) because it requires per-video wording
  decisions, a merge negotiation with the hook cue, a placement check against the
  Spotify-legibility preference, and a repeatable post-hoc verification — an
  operational procedure with an output contract. The underlying evidence stays
  documented in metadata-and-discovery.md; the skill only operationalises it.
  Placed in experimental/ per ADR 0005: evidence tier is hypothesis (lore + one
  documented anecdote), so it must earn promotion through use and phase-5 data.
