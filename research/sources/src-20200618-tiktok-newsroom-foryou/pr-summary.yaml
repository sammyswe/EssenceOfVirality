risks_and_uncertainty: >-
  Single-source seed: the working model currently rests on one 2020 corporate
  communication. All disclosure claims are dated and platform-dependent; the same
  post states that factors and weights change continuously. The two hypotheses are
  unmeasured; the ~40% payoff-placement threshold circulating in the exemplar skills
  is explicitly provisional. Marketing-reviewed source: incentive-bias assessed per
  claim (highest on follower-count and diversification framing).

