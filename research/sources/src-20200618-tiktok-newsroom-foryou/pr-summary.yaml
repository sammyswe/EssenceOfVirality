findings_summary: >-
  TikTok's official 2020 For You disclosure yields seven high-confidence,
  platform-dependent disclosure claims (ranking factor categories; completion as a
  strong weighted signal; follower count not a direct factor; viewer cold start; feed
  diversification rules; explicit negative-feedback mechanisms; eligibility gates).
  Two testable hypotheses were derived (completion as a distribution lever for short
  mix videos; first-second promise vs early skipping) and one heuristic technique
  record (optimise for completed watches, niche-adapted). The creator brief was
  registered as a source so three standing preferences (music centrality, anonymity,
  Spotify legibility) exist as citable claims.

