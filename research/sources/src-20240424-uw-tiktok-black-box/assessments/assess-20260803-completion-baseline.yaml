created_at: 2026-08-03
produced_by: evidence-analyst
version: 1
inputs: [claim-20240424-completion-baseline]

claim_id: claim-20240424-completion-baseline
dimensions:
  relevance:
    rating: strong
    note: "First external calibration point for completion expectations — watch-to-end is the exception, not the norm, for short mix videos."
  specificity:
    rating: strong
    note: "~55% of videos not watched to the end; most participants finish 30-50%; stable over 120 days with growing usage and liking."
  transparency:
    rating: strong
    note: "Figures taken from the CHI 2024 primary paper; extraction cross-checked the press interview and corrected its inverted 55% statistic."
  incentive_bias:
    rating: weak
    note: "Low bias risk: peer-reviewed data-donation study reporting descriptive viewer behaviour, not prescribing creator tactics."
  niche_transferability:
    rating: moderate
    note: "Viewer-side average across all content; attention metric caps loops at 100%, so loop-heavy sub-20s mix videos are under-described."
  agreement_other_sources:
    rating: moderate
    note: "Complements claim-20200618-completion-strong-signal (full watches weighted positively) by establishing that most viewers do not complete most videos."
correlation_causation_note: >-
  Descriptive baseline across donated viewing sessions; not a per-video benchmark
  and not evidence that raising completion above the population average guarantees
  wider distribution.
recommended_confidence: medium
recommended_status: active
unsupported_certainty_flags: []
reasoning: >-
  Authoritative viewer-side baseline from a cross-checked primary paper; essential
  for setting realistic completion targets in the mix niche without treating full
  watch-through as the typical viewer behaviour.
