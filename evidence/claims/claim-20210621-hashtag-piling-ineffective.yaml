statement: >-
  Adding trending hashtags, algorithm-targeted hashtags (#fyp, #foryou) or piling up
  popular hashtags showed no relationship to play counts among 300,617 trending
  videos (Jan 2021); videos with the most popular hashtag combinations often had low
  plays, and almost no top-10% video used that day's trending hashtags.
