statement: >-
  Creator theories about the TikTok algorithm ('algorithmic lore') materially shape
  what creators make, yet are often unfounded: Klug 2021 tested the three most common
  assumptions and found the most followed one (hashtag piling) false, and Herman 2023
  documents the author's own plausible length lore being contradicted by data.
  Perceived algorithmic preferences must not be treated as evidence of actual ones.
