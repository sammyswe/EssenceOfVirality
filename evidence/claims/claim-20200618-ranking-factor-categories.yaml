statement: >-
  TikTok stated (2020) that For You ranking combines factors including: user
  interactions (videos liked or shared, accounts followed, comments posted, content
  created), video information (captions, sounds, hashtags), and device/account
  settings (language, country, device type) — with device/account settings weighted
  lower because users do not actively express them as preferences.
