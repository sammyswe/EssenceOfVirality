statement: >-
  TikTok stated (2020) that the For You feed deliberately diversifies: it generally
  will not show two videos in a row made with the same sound or by the same creator,
  does not recommend duplicated or already-seen content or spam, and intentionally
  injects videos outside a user's expressed interests, partly to gauge broader
  popularity.
