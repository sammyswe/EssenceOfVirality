statement: >-
  According to a leaked TikTok engineering document (as cited by Lynch 2025), the two
  main metrics tracked to grow daily active viewership are retention (whether a user
  returns) and watch time, and videos are scored by a machine-learned prediction over
  summed user interactions (likes, comments, follows, shares), with the
  highest-scoring videos served to each user.
