statement: >-
  TikTok auto-loops videos until the viewer scrolls, and additional loops register as
  additional plays; creators exploit this with very short videos whose content takes
  longer than one loop to absorb (e.g. dense on-screen text), inflating view counts
  and perceived interest (Herman 2023, observed pattern).
