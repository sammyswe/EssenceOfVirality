limitations:
  - "UTC only, no viewer-timezone or geography data: cannot be converted into a posting schedule for a UK audience."
  - "Correlational within trending videos; the mechanism (audience activity vs algorithm batching) is unknown."
  - "Confounded with video age: top-10% videos were older on average."
contradictions: []
proposed_actions:
