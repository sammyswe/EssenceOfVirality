statement: >-
  Among trending videos (Jan 2021), posting time significantly separated the top 10%
  of play counts from the remaining 90% (KS test, p=1.8e-41): top-10% videos were
  largely posted 06:00-16:00 UTC (peak ~11:00), the rest mostly 00:00-04:00 UTC.
  Trending is not immediate — some top videos were 2+ weeks old.
